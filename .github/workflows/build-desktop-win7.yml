name: Build Desktop App (Win7 Compatible)
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.77.2
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 使用较旧的 LTS 版本以匹配旧版 Pake

      - name: Install Pake CLI (Earliest Win7 Compatible)
        run: npm install -g pake-cli@1
      
      - name: Patch Cargo.lock for Rust 1.77 Compatibility
        run: |
          $lockPath = "C:\npm\prefix\node_modules\pake-cli\src-tauri\Cargo.lock"
          if (Test-Path $lockPath) {
            (Get-Content $lockPath) -replace '^version = 4$', 'version = 3' | Set-Content $lockPath
            Write-Host "✅ 已将 Cargo.lock 版本降级为 3，以兼容 Rust 1.77.2"
          } else {
            Write-Error "未找到 Cargo.lock 文件：$lockPath"
            exit 1
          }

      - name: Build Desktop App
        run: |
          pake "https://slfftz2011.github.io/Cookies.vs.Zombies/" --name "CookiesVsZombies" --width 1280 --height 800
          
      - name: Rebuild with Win7 Patch
        run: pake "https://slfftz2011.github.io/Cookies.vs.Zombies/" --name "CookiesVsZombies" --width 1280 --height 800

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: CookiesVsZombies.msi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CookiesVsZombies.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}