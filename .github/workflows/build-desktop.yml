name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Pake
        uses: tw93/Pake@v3
        with:
          url: "https://slfftz2011.github.io/Cookies.vs.Zombies/"
          name: "CookiesVsZombies"
          width: 1280
          height: 800
          # icon: "https://slfftz2011.github.io/Cookies.vs.Zombies/icon.png"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}